[package]
name = "mysz-core"
version = "0.5.7"
edition = "2024"
license = "Apache-2.0"
description = "The main compiler for the Mysz language project"
repository = "https://github.com/mysz-lang/mysz-core"
readme = "README.md"
keywords = ["language", "compiler", "mysz"]
categories = ["compilers", "parser-implementations"]

[dependencies]
clap = { version = "4", features = ["derive"] }
target-lexicon = "0.12"
regex = "1.10"
serde = "1.0.228"
serde_json = "1.0.150"
serde_derive = "1.0.228"
indexmap = "2.14.0"
inkwell = {version = "0.10.0", features = ["llvm22-1"]}

[features]
docs = ["inkwell/llvm22-1-no-llvm-linking"]

[package.metadata.docs.rs]
features = ["docs"]